# ═══════════════════════════════════════════════════════
#  CI/CD Pipeline — Task Manager Demo
#  Trigger: push lên main hoặc tạo Pull Request vào main
# ═══════════════════════════════════════════════════════
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ngăn chạy 2 pipeline cùng lúc khi push liên tiếp
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ───────────────────────────────────────────────────────
# JOB 1: LINT — Kiểm tra code style
# ───────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Lint Backend
        working-directory: ./backend
        run: |
          npm ci
          npm run lint

      - name: Lint Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint

  # ───────────────────────────────────────────────────────
  # JOB 2: TEST — Chạy unit tests
  # ───────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # Không cần phụ thuộc lint — chạy song song để tiết kiệm thời gian
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Test Backend
        working-directory: ./backend
        run: |
          npm ci
          npm test
        # Upload coverage để xem sau
      - name: Upload Backend Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

      - name: Test Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm test

      - name: Build Frontend (verify no build errors)
        working-directory: ./frontend
        run: npm run build

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  # ───────────────────────────────────────────────────────
  # JOB 3: DEPLOY FRONTEND → Vercel
  # Chỉ chạy khi: push lên main + lint + test đều PASS
  # ───────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: vercel --prod --yes --token=$VERCEL_TOKEN
        working-directory: ./frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ───────────────────────────────────────────────────────
  # JOB 4: DEPLOY BACKEND → Render
  # Chỉ chạy khi: push lên main + lint + test đều PASS
  # ───────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Render HTTP status: $HTTP_STATUS"
          if [[ "$HTTP_STATUS" =~ ^2 ]]; then
            echo "✅ Deploy triggered successfully on Render!"
          else
            echo "❌ Render deploy hook failed with status $HTTP_STATUS"
            exit 1
          fi
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  # ───────────────────────────────────────────────────────
  # JOB 5: NOTIFY — Tóm tắt kết quả deploy
  # ───────────────────────────────────────────────────────
  notify:
    name: Notify Deployment Result
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Summary
        run: |
          echo "=============================="
          echo "  DEPLOYMENT SUMMARY"
          echo "=============================="
          echo "Repo   : ${{ github.repository }}"
          echo "Branch : ${{ github.ref_name }}"
          echo "Commit : ${{ github.event.head_commit.message }}"
          echo "Author : ${{ github.actor }}"
          echo "------------------------------"
          echo "Frontend (Vercel) : ${{ needs.deploy-frontend.result }}"
          echo "Backend  (Render) : ${{ needs.deploy-backend.result }}"
          echo "=============================="
          if [[ "${{ needs.deploy-frontend.result }}" == "success" && "${{ needs.deploy-backend.result }}" == "success" ]]; then
            echo "✅ All deployments succeeded!"
          else
            echo "❌ One or more deployments failed."
            exit 1
          fi
