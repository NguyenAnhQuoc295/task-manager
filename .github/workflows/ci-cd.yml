# ═══════════════════════════════════════════════════════
#  CI/CD Pipeline — Task Manager Demo
#  Trigger: push lên main hoặc tạo Pull Request vào main
# ═══════════════════════════════════════════════════════
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ngăn chạy 2 pipeline cùng lúc khi push liên tiếp
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ───────────────────────────────────────────────────────
# JOB 1: LINT — Kiểm tra code style
# ───────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Lint Backend
        working-directory: ./backend
        run: |
          npm ci
          npm run lint

      - name: Lint Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint

  # ───────────────────────────────────────────────────────
  # JOB 2: TEST — Chạy unit tests
  # ───────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # Không cần phụ thuộc lint — chạy song song để tiết kiệm thời gian
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Test Backend
        working-directory: ./backend
        run: |
          npm ci
          npm test
        # Upload coverage để xem sau
      - name: Upload Backend Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

      - name: Test Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm test

      - name: Build Frontend (verify no build errors)
        working-directory: ./frontend
        run: npm run build

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  # ───────────────────────────────────────────────────────
  # JOB 3: DEPLOY FRONTEND → Vercel
  # Chỉ chạy khi: push lên main + lint + test đều PASS
  # ───────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [lint, test] # ← Phụ thuộc cả 2 job trên
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        working-directory: ./frontend
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ───────────────────────────────────────────────────────
  # JOB 4: DEPLOY BACKEND → AWS EC2
  # Chỉ chạy khi: push lên main + lint + test đều PASS
  # ───────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production-backend
      url: https://task-manager-api.onrender.com

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render response: $RESPONSE"
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "=== Deploy triggered on Render! ==="
          else
            echo "=== Render deploy hook returned HTTP $RESPONSE ==="
            exit 1
          fi

  # ───────────────────────────────────────────────────────
  # JOB 5: NOTIFY — Thông báo kết quả (Slack)
  # ───────────────────────────────────────────────────────
  notify:
    name: Notify Deployment Result
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Notify Slack on Success
        if: needs.deploy-frontend.result == 'success' && needs.deploy-backend.result == 'success' && secrets.SLACK_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d '{"text": "✅ *Deployment Successful!* — ${{ github.repository }} @ ${{ github.ref_name }} by ${{ github.actor }}"}'

      - name: Notify Slack on Failure
        if: (needs.deploy-frontend.result == 'failure' || needs.deploy-backend.result == 'failure') && secrets.SLACK_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d '{"text": "❌ *Deployment Failed!* — ${{ github.repository }} by ${{ github.actor }}"}'

      - name: Log result (no Slack)
        if: secrets.SLACK_WEBHOOK_URL == ''
        run: |
          echo "SLACK_WEBHOOK_URL not set — skipping Slack notification"
          echo "Frontend: ${{ needs.deploy-frontend.result }}"
          echo "Backend:  ${{ needs.deploy-backend.result }}"
