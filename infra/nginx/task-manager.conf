# Nginx config cho Task Manager API
# File này deploy lên EC2 tại: /etc/nginx/sites-available/task-manager

server {
    # Certbot sẽ tự động thêm block SSL vào đây
    listen 80;
    server_name api.yourdomain.com;   # ← Thay bằng domain thật của bạn

    # Gzip compression
    gzip on;
    gzip_types application/json text/plain;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Reverse proxy đến Node.js app
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # Headers cần thiết
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Health check endpoint — không log để tránh spam
    location /health {
        proxy_pass http://localhost:3000/health;
        access_log off;
    }
}
